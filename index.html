<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimQC — Quantum Circuit Simulator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-color: var(--simqc-border-strong) var(--simqc-panel); }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--simqc-background); color: var(--simqc-foreground); }
    #app { display: grid; grid-template-areas: "left main right" "bottom bottom bottom"; grid-template-rows: 1fr 150px; grid-template-columns: 260px 1fr 260px; height: 100vh; gap: 0; }
    .panel { background: var(--simqc-panel); border: 1px solid var(--simqc-border); display: flex; flex-direction: column; overflow: hidden; padding: 8px; gap: 8px; }
    .panel.left { grid-area: left; }
    .panel.main { grid-area: main; position: relative; background: var(--simqc-background); overflow: auto; }
    .panel.right { grid-area: right; }
    .panel.bottom { grid-area: bottom; overflow-y: auto; }
    .panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--simqc-text-muted); border-bottom: 1px solid var(--simqc-border); padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    canvas#circuit { display: block; width: 100%; height: 100%; background: var(--simqc-background); }
    .muted { color: var(--simqc-text-muted); font-size: 13px; line-height: 1.4; }
    h1 { font-size: 18px; margin-bottom: 8px; color: var(--simqc-accent); }
    button { background: var(--simqc-control); border: 1px solid var(--simqc-border-strong); color: var(--simqc-foreground); padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; border-radius: 3px; }
    button:hover { background: var(--simqc-control-hover); border-color: var(--simqc-accent-hover); }
    button:active { background: var(--simqc-accent); border-color: var(--simqc-accent); color: var(--simqc-accent-contrast); }
    button:focus-visible { outline: 2px solid var(--simqc-focus); outline-offset: 2px; }
    button:disabled { color: var(--simqc-text-muted); border-color: var(--simqc-border); cursor: not-allowed; opacity: 0.65; }
    a { color: var(--simqc-accent); }
    ::selection { background: var(--simqc-selection); color: var(--simqc-foreground); }
    #gate-palette { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .palette-row { display: contents; }
    #code-view, #inspector { background: var(--simqc-panel-raised); border: 1px solid var(--simqc-border); border-radius: 3px; padding: 8px; overflow: auto; }
    #code-view { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .note { font-size: 12px; color: var(--simqc-text-muted); margin-top: 8px; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .toolbar-label { font-size: 11px; color: var(--simqc-text-muted); margin-right: 6px; align-self: center; }
    .tab-strip { display: flex; gap: 2px; margin-bottom: 6px; border-bottom: 1px solid var(--simqc-border); padding-bottom: 4px; }
    .tab { background: var(--simqc-control); border: 1px solid var(--simqc-border-strong); color: var(--simqc-text-muted); padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: 3px 3px 0 0; border-bottom: none; }
    .tab.active { background: var(--simqc-panel-raised); color: var(--simqc-foreground); border-bottom: 2px solid var(--simqc-accent); margin-bottom: -1px; }
    .tab:hover:not(.active) { background: var(--simqc-control-hover); }
    .field { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
    .field input { background: var(--simqc-control); border: 1px solid var(--simqc-border-strong); color: var(--simqc-foreground); padding: 2px 6px; font: inherit; font-size: 12px; border-radius: 3px; width: 60px; }
    .status { font-size: 11px; color: var(--simqc-text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--simqc-border); min-height: 14px; }
    textarea { width: 100%; height: 140px; background: var(--simqc-panel-raised); border: 1px solid var(--simqc-border); border-radius: 3px; color: var(--simqc-foreground); font: inherit; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; padding: 6px; resize: vertical; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .small { font-size: 11px; color: var(--simqc-text-muted); }
    .panel-toggle { font-size: 10px; padding: 2px 6px; }
    .ai-section { margin-top: 8px; border: 1px solid var(--simqc-border); border-radius: 3px; padding: 6px; background: var(--simqc-panel-raised); }
    .ai-section .panel-title { font-size: 11px; border-bottom: none; padding-bottom: 0; margin-bottom: 4px; }
    .ai-output { margin-top: 4px; font-size: 11px; font-family: ui-monospace, monospace; word-break: break-all; max-height: 120px; overflow-y: auto; }
    .io-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .io-output { margin-top: 4px; font-size: 11px; font-family: ui-monospace, monospace; word-break: break-all; max-height: 100px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="app">
    <aside class="panel left" id="panel-left">
      <div class="panel-title">Gate Palette <button class="panel-toggle" data-toggle="left">▾</button></div>
      <div id="gate-palette" class="muted">Loading gates…</div>
    </aside>
    <section class="panel main" id="panel-main">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
        Circuit Editor <button class="panel-toggle" data-toggle="main">▾</button>
        <div class="toolbar" style="margin-left:auto;">
          <button id="btn-simulate">Simulate</button>
          <button id="btn-reset">Reset</button>
          <button id="btn-undo" title="Undo">↶</button>
          <button id="btn-redo" title="Redo">↷</button>
        </div>
      </div>
      <canvas id="circuit"></canvas>
    </section>
    <aside class="panel right" id="panel-right">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
        Code & AI <button class="panel-toggle" data-toggle="right">▾</button>
      </div>
      <div class="toolbar">
        <button id="btn-copy">Copy</button>
        <button id="btn-import">Import</button>
        <button id="btn-export">Export</button>
        <button id="btn-share">Share URL</button>
      </div>
      <textarea id="code-view" spellcheck="false">{}</textarea>
      <div class="note">Canonical SimQC v1 JSON. Edit and press Enter to apply.</div>
      <div id="ai-explainer" class="ai-section">
        <div class="panel-title">AI Explainer</div>
        <button id="btn-explain">Explain circuit</button>
        <div id="ai-output" class="muted"></div>
      </div>
      <div id="ai-builder" class="ai-section">
        <div class="panel-title">AI Builder</div>
        <div class="field"><span class="toolbar-label">Prompt:</span><input id="ai-prompt" type="text" placeholder="e.g. Bell state on 2 qubits"></div>
        <button id="btn-build">Build circuit</button>
        <div id="builder-output" class="ai-output"></div>
      </div>
      <div id="io-analyzer" class="ai-section">
        <div class="panel-title">I/O Analyzer</div>
        <div class="io-row"><span class="toolbar-label">Input row:</span><input id="io-input-row" type="number" value="0" min="0"><span class="toolbar-label">Output row:</span><input id="io-output-row" type="number" value="1" min="0"><button id="btn-analyze">Analyze</button></div>
        <div id="io-output" class="io-output"></div>
      </div>
    </aside>
    <aside class="panel bottom" id="panel-bottom">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
        Inspector <button class="panel-toggle" data-toggle="bottom">▾</button>
        <div class="toolbar" style="margin-left:auto;">
          <span id="debug-step" class="small">Step <span id="step-current">0</span>/<span id="step-total">0</span></span>
          <button id="btn-step">Step</button>
          <button id="btn-run">Run</button>
        </div>
      </div>
      <div class="tab-strip" id="tab-strip">
        <button class="tab active" data-tab="amplitudes">Amplitudes</button>
        <button class="tab" data-tab="probabilities">Probabilities</button>
        <button class="tab" data-tab="bloch">Bloch Spheres</button>
      </div>
      <div id="inspector-content" class="muted">No state yet.</div>
      <div class="field"><span class="toolbar-label">Shots:</span><input id="shots-input" type="number" value="1024" min="1"><button id="btn-sample">Sample</button></div>
      <div id="shot-hist" class="muted"></div>
      <div id="status" class="status"></div>
    </aside>
  </div>

  <script type="module">
    import { renderCircuit } from './src/canvas/Renderer.js';
    import { theme, themeCssVariables } from './src/ui/theme.js';
    import {
      panelModel, history, interaction, catalog,
      InspectorUI, Inspector,
      gateArity, gateControlCount, gateNeedsTarget2,
      AIExplainer,
      DebuggerUI, AIBuilderUI, IOAnalyzerUI, URLCodec,
    } from './src/main.js';
    import { AppController } from './src/ui/AppController.js';

    for (const [name, value] of Object.entries(themeCssVariables)) {
      document.documentElement.style.setProperty(name, value);
    }

    const canvas = document.getElementById('circuit');
    const ctx = canvas.getContext('2d');

    const app = new AppController({
      history, interaction, catalog, theme: theme, Inspector,
      AIBuilderUI, IOAnalyzerUI,
      canvasEl: canvas,
      paletteEl: document.getElementById('gate-palette'),
      inspectorEl: document.getElementById('inspector-content'),
      codeEl: document.getElementById('code-view'),
      statusEl: document.getElementById('status'),
    });

    app.onRender(({ circuit, purity }) => {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const cssW = rect.width > 0 ? rect.width : 680;
      const cssH = rect.height > 0 ? rect.height : 660;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      const drawing = renderCircuit(circuit, theme, { labelGutter: 48, purity });
      const { gateFill, gateStroke, foreground, entanglementGlow, entropyAccent } = theme;
      for (const g of drawing.gates) {
        if (g.kind === 'label') { ctx.fillStyle = g.color; ctx.font = '13px system-ui'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(g.text, g.x - 4, g.y); }
        else if (g.kind === 'rowSeparator') { ctx.strokeStyle = g.color; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); }
        else if (g.kind === 'line') { ctx.strokeStyle = g.color; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); }
        else if (g.kind === 'controlLine') { ctx.strokeStyle = entanglementGlow; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); }
        else if (g.kind === 'controlDot') { ctx.fillStyle = entanglementGlow; ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI * 2); ctx.fill(); }
        else if (g.kind === 'targetCircle') { ctx.strokeStyle = foreground; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(g.x, g.y, 7, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = foreground; ctx.fillText('\u2295', g.x - 4, g.y + 5); }
        else if (g.kind === 'swapLine') { ctx.strokeStyle = foreground; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke(); }
        else if (g.kind === 'gate') { ctx.fillStyle = g.color; ctx.strokeStyle = g.stroke; ctx.lineWidth = 1.5; ctx.fillRect(g.x, g.y, g.w, g.h); ctx.strokeRect(g.x, g.y, g.w, g.h); ctx.fillStyle = foreground; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; let label = g.gateId; if (g.thetaRad !== undefined) label += ` \u03b8=${g.thetaRad.toFixed(2)}`; ctx.fillText(label, g.cx, g.cy); }
        else if (g.kind === 'rowGlow') { ctx.save(); ctx.globalAlpha = g.alpha; ctx.fillStyle = g.color; ctx.fillRect(g.x, g.y, g.w, g.h); ctx.restore(); }
      }
    });

    const inspectorContent = document.getElementById('inspector-content');
    let activeTab = 'amplitudes';
    app.onInspector(() => { renderInspector(); });

    function renderInspector() {
      if (!app.currentCircuit) { inspectorContent.textContent = 'No state yet.'; return; }
      const probs = app.probabilities();
      const labels = app.ketLabels();
      const n = app.numQubits;
      if (activeTab === 'amplitudes') {
        const amps = app.amplitudes();
        let html = '<table style="font-size:12px;width:100%;border-collapse:collapse;"><thead><tr><th style="text-align:left;padding:2px;">State</th><th style="text-align:right;padding:2px;">Re</th><th style="text-align:right;padding:2px;">Im</th><th style="text-align:right;padding:2px;">Probability</th></tr></thead><tbody>';
        for (let i = 0; i < amps.length; i++) { const a = amps[i]; if (a.prob > 1e-6) { html += `<tr><td style="padding:2px;color:var(--simqc-accent)">★${labels[i]}</td><td style="padding:2px;text-align:right">${a.re.toFixed(4)}</td><td style="padding:2px;text-align:right">${a.im.toFixed(4)}</td><td style="padding:2px;text-align:right">${a.prob.toFixed(4)}</td></tr>`; } }
        html += '</tbody></table>'; inspectorContent.innerHTML = html;
      } else if (activeTab === 'probabilities') {
        let html = '<table style="font-size:12px;width:100%;border-collapse:collapse;"><thead><tr><th style="text-align:left;padding:2px;">State</th><th style="text-align:right;padding:2px;">Probability</th><th style="text-align:left;padding:2px;">Distribution</th></tr></thead><tbody>';
        for (let i = 0; i < probs.length; i++) { const p = probs[i]; if (p > 1e-6) { const barW = Math.round(p * 100); html += `<tr><td style="padding:2px;color:var(--simqc-accent)">★${labels[i]}</td><td style="padding:2px;text-align:right">${(p * 100).toFixed(2)}%</td><td style="padding:2px"><div style="background:var(--simqc-border);height:6px;width:100px;"><div style="background:var(--simqc-accent);height:6px;width:${barW}px;"></div></div></td></tr>`; } }
        html += '</tbody></table>'; inspectorContent.innerHTML = html;
      } else {
        let html = '<div style="font-size:12px;line-height:1.5;"><div style="font-weight:bold;margin-bottom:4px;">Bloch vectors per qubit row</div><table style="width:100%;border-collapse:collapse;"><thead><tr><th style="text-align:left;padding:2px;">Qubit row</th><th style="text-align:right;padding:2px;">x</th><th style="text-align:right;padding:2px;">y</th><th style="text-align:right;padding:2px;">z</th><th style="text-align:right;padding:2px;">|r|</th><th style="text-align:right;padding:2px;">S_L</th></tr></thead><tbody>';
        for (let q = 0; q < n; q += 1) { const v = app.bloch(q); const sL = app.linearEntropy(q); const len = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z); html += `<tr><td style="padding:2px">Qubit ${q}</td><td style="padding:2px;text-align:right">${v.x.toFixed(3)}</td><td style="padding:2px;text-align:right">${v.y.toFixed(3)}</td><td style="padding:2px;text-align:right">${v.z.toFixed(3)}</td><td style="padding:2px;text-align:right">${len.toFixed(3)}</td><td style="padding:2px;text-align:right">${sL.toFixed(3)}</td></tr>`; }
        html += '</tbody></table></div>'; inspectorContent.innerHTML = html;
      }
      app.draw();
    }

    document.getElementById('tab-strip').addEventListener('click', (ev) => {
      const tab = ev.target.closest('.tab[data-tab]');
      if (!tab) return;
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active'); activeTab = tab.dataset.tab; renderInspector();
    });

    const codeEl = document.getElementById('code-view');
    app.onCode(() => { codeEl.value = app.serialize(); });
    codeEl.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); const result = app.deserialize(codeEl.value); if (result.ok) app.draw(); }
    });

    document.getElementById('btn-copy').addEventListener('click', () => { codeEl.select(); document.execCommand('copy'); });
    document.getElementById('btn-import').addEventListener('click', () => {
      const input = prompt('Paste canonical v1 JSON:');
      if (input) { const result = app.deserialize(input); if (result.ok) { codeEl.value = app.serialize(); app.draw(); } else alert(result.error); }
    });
    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([app.serialize()], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuit.simqc.json'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('btn-share').addEventListener('click', () => {
      const encoded = app.encodeURL();
      if (!encoded) return;
      const url = location.origin + location.pathname + '#circuit=' + encoded;
      prompt('Shareable URL (copy):', url);
    });

    document.getElementById('btn-simulate').addEventListener('click', () => { app.simulate(); app.draw(); renderInspector(); });
    document.getElementById('btn-reset').addEventListener('click', () => { app.reset(); app.draw(); renderInspector(); });
    document.getElementById('btn-undo').addEventListener('click', () => { app.undo(); app.draw(); renderInspector(); });
    document.getElementById('btn-redo').addEventListener('click', () => { app.redo(); app.draw(); renderInspector(); });
    document.getElementById('btn-step').addEventListener('click', () => { app.step(); app.draw(); renderInspector(); });
    document.getElementById('btn-run').addEventListener('click', () => { app.simulate(); app.draw(); renderInspector(); });

    const stepCurrent = document.getElementById('step-current');
    const stepTotal = document.getElementById('step-total');
    function updateDebugStep() { stepCurrent.textContent = app.getCurrentStep(); stepTotal.textContent = app.getTotalSteps(); }
    updateDebugStep();

    const shotsInput = document.getElementById('shots-input');
    app.onInspector(() => { });
    shotsInput.addEventListener('change', (ev) => { app.setShots(ev.target.value); });
    document.getElementById('btn-sample').addEventListener('click', () => {
      app.simulate();
      const hist = app.sampleShots();
      const el = document.getElementById('shot-hist');
      const n = app.numQubits;
      let html = '<div style="font-size:12px;line-height:1.5;">';
      const total = app.shots;
      for (const [idx, count] of hist.entries()) {
        const label = idx.toString(2).padStart(n, '0');
        html += `<span style="color:var(--simqc-accent)">★${label}</span> ${count}/${total} (${((count/total)*100).toFixed(1)}%)<br>`;
      }
      html += '</div>'; el.innerHTML = html;
    });

    document.getElementById('btn-explain').addEventListener('click', async () => {
      const out = document.getElementById('ai-output');
      out.textContent = 'Explaining…';
      try {
        const { flattenCircuit } = await import('./src/circuit/Flatten.js');
        const instructions = flattenCircuit(app.currentCircuit);
        const summaries = [];
        for (let i = 0; i < instructions.length; i++) summaries.push({ topK: [], marginals: [] });
        const explainer = new AIExplainer();
        const text = await explainer.explain(instructions, summaries, app.numQubits);
        out.textContent = text;
      } catch (err) { out.textContent = 'AI unavailable: ' + err.message; }
    });

    const aiPrompt = document.getElementById('ai-prompt');
    const builderOutput = document.getElementById('builder-output'); builderOutput.style.whiteSpace = 'pre-wrap';
    const aiBuilder = app.aiBuilder;
    if (aiBuilder) {
      aiBuilder.onChange((s) => {
        if (s.status === 'error') builderOutput.textContent = 'Error: ' + (s.error || '');
        else if (s.status === 'ok') builderOutput.textContent = s.generatedJson || '';
        else builderOutput.textContent = '';
      });
      document.getElementById('btn-build').addEventListener('click', async () => {
        builderOutput.textContent = 'Building…';
        aiBuilder.setPrompt(aiPrompt.value);
        await aiBuilder.build();
      });
    } else {
      document.getElementById('btn-build').disabled = true;
      builderOutput.textContent = 'AI Builder unavailable.';
    }

    const ioInputRow = document.getElementById('io-input-row');
    const ioOutputRow = document.getElementById('io-output-row');
    const ioOutput = document.getElementById('io-output'); ioOutput.style.whiteSpace = 'pre-wrap';
    const ioAnalyzer = app.ioAnalyzer;
    if (ioAnalyzer) {
      ioAnalyzer.onChange((s) => {
        if (s.status === 'error') ioOutput.textContent = 'Error: ' + (s.error || '');
        else if (s.status === 'ok' && s.analysis) {
          const a = s.analysis;
          let html = `<div>Input rows affected in ${a.inputAffectedColumns.length} column(s): [${a.inputAffectedColumns.join(', ')}]</div>`;
          html += `<div>Output rows affected in ${a.outputAffectedColumns.length} column(s): [${a.outputAffectedColumns.join(', ')}]</div>`;
          html += `<div>Touched columns: ${a.touchedColumns.length}</div>`;
          html += `<div>Causal chain: ${a.causalChain.map((c) => 'col ' + c.column).join(' \u2192 ')}</div>`;
          html += `<div>Summary: ${a.summary}</div>`;
          if (s.sparse) html += `<div>Sparse top-k: ${s.sparse.topK.map((t) => t.label).join(', ')}</div>`;
          ioOutput.innerHTML = html;
        } else ioOutput.textContent = '';
      });
      document.getElementById('btn-analyze').addEventListener('click', async () => {
        const inputRow = parseInt(ioInputRow.value, 10) || 0;
        const outputRow = parseInt(ioOutputRow.value, 10) || 0;
        ioAnalyzer.setInputRows([inputRow]);
        ioAnalyzer.setOutputRows([outputRow]);
        const { flattenCircuit } = await import('./src/circuit/Flatten.js');
        ioAnalyzer.analyze(flattenCircuit(app.currentCircuit), app._stepTrace);
      });
    } else {
      document.getElementById('btn-analyze').disabled = true;
      ioOutput.textContent = 'I/O Analyzer unavailable.';
    }

    document.querySelectorAll('.panel-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        panelModel.toggle(id);
        const panel = document.getElementById('panel-' + id);
        if (panel) { const region = panelModel.getRegion(id); panel.style.display = region && region.visible ? 'flex' : 'none'; }
      });
    });

    app.draw(); renderInspector(); codeEl.value = app.serialize(); updateDebugStep();

    if (location.hash.startsWith('#circuit=')) {
      const encoded = location.hash.slice('#circuit='.length);
      const result = app.decodeURL(encoded);
      if (result.ok) { codeEl.value = app.serialize(); app.draw(); renderInspector(); updateDebugStep(); }
      else alert('Failed to load circuit from URL: ' + result.error);
    }

    canvas.addEventListener('pointerdown', (ev) => {
      const entry = app.getSelectedEntry();
      if (!entry) return;
      interaction.pick(entry, ev.offsetX, ev.offsetY);
    });
    canvas.addEventListener('pointermove', (ev) => {
      if (interaction.phase !== 'idle') interaction.drag(ev.offsetX, ev.offsetY);
      app.setPointer(ev.offsetX, ev.offsetY);
    });
    canvas.addEventListener('pointerup', (ev) => {
      if (interaction.phase === 'idle') return;
      const cell = interaction.snap(ev.offsetX, ev.offsetY, { colPitch: 20, rowPitch: 20, colOffset: 48, rowOffset: 10 });
      const entry = app.getSelectedEntry();
      if (entry) {
        const result = app.placeGateAt(cell.column, cell.row, entry.name);
        if (!result.conflict) { app.draw(); renderInspector(); }
      }
      interaction.cancel();
    });

    window.addEventListener('resize', () => { app.draw(); });
  </script>
</body>
</html>
